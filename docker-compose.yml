# Run the backend locally with one command:  docker compose up --build
# API: http://localhost:8080/api/dashboard — Swagger UI: http://localhost:8080/swagger-ui.html
#
# The database credentials below are for this throwaway local container only
# (its port is not published to the host); they are not secrets.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harbour
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: harbour
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour -d harbour"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/harbour
      DB_USERNAME: harbour
      DB_PASSWORD: harbour
      # TZ comes from the Dockerfile; CORS defaults to http://localhost:5173.
    ports:
      - "8080:8080"

volumes:
  db-data:
